[project]
name = "ai-sow-plugin-runtime"
version = "0.1.0b1"
description = "Locked runtime dependencies for the AI SOW plugin"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.26.0",
  "openpyxl==3.1.5",
  "pypdf==6.16.2",
]

[dependency-groups]
dev = ["pytest==8.4.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["skills", "tests"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib"]
